<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Round Robin">
  <title>{% block title %}Round Robin{% endblock %}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/static/icon.svg" alt="" width="24" height="24">Round Robin</a>
    <nav>
      {% if organizer %}
        <a href="/players">Players</a>
        <form method="post" action="/logout"><button class="linklike">Log out</button></form>
      {% else %}
        <a href="/login">Organizer</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for kind, message in flashes %}
      <div class="flash {{ kind }}" role="{{ 'alert' if kind == 'error' else 'status' }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
